<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مغامرات إياد في العلوم</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Tahoma',sans-serif;background:linear-gradient(135deg,#e8f7ff,#f5f0ff);color:#20334a;min-height:100vh;padding:16px}.wrap{max-width:900px;margin:auto}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 24px #294a6620;margin:12px auto}.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;text-align:center}.hero svg{width:130px;flex-shrink:0}.htext h1{margin:5px;color:#3158a6}.htext p{margin:8px 0;color:#51657b}.btn{border:0;border-radius:14px;padding:12px 18px;background:#4269bd;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin:5px}.btn.secondary{background:#14a69a}.btn.light{background:#edf3ff;color:#294d93}.btn:disabled{opacity:.4}.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.badge{background:#f0f5ff;padding:8px 12px;border-radius:999px;font-weight:bold}.question{font-size:1.3rem;font-weight:800;line-height:1.7;margin:18px 0;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{padding:14px;border:2px solid #dce7f6;border-radius:15px;background:#f9fbff;font-size:1.05rem;cursor:pointer;color:#263f61}.choice:hover{border-color:#6e91df}.choice.selected{background:#dceaff;border-color:#4269bd}.feedback{text-align:center;font-size:1.2rem;font-weight:bold;padding:14px;border-radius:14px;margin-top:12px}.correct{background:#e3f9ee;color:#157b51}.wrong{background:#fff0e5;color:#a85718}.progress{height:12px;background:#e9eef8;border-radius:20px;overflow:hidden}.bar{height:100%;background:#4e79ce;width:0;transition:.3s}.hide{display:none}.foot{text-align:center;font-size:.9rem;color:#61748c;padding:8px}.topics{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:12px 0}.topic{background:#e6f5ff;border-radius:10px;padding:7px 10px;font-size:.85rem}
@media(max-width:560px){body{padding:9px}.panel{padding:15px}.choices{grid-template-columns:1fr}.question{font-size:1.15rem}.hero svg{width:105px}}
</style></head><body><div class="wrap"><section class="panel hero"><svg viewBox="0 0 160 190" aria-label="إياد"><ellipse cx="80" cy="178" rx="45" ry="9" fill="#dce8f5"/><path d="M45 104 Q40 140 35 163 Q80 180 125 163 L115 105" fill="#3f74ce"/><path d="M57 115 L80 140 L103 115" fill="#fff"/><rect x="66" y="88" width="28" height="27" rx="10" fill="#f6c79e"/><ellipse cx="80" cy="67" rx="43" ry="48" fill="#f7c99e"/><path d="M38 62 Q25 16 70 19 Q99 4 118 29 Q137 42 122 64 Q118 48 105 43 Q90 49 78 35 Q69 48 52 43Z" fill="#e9b63c"/><ellipse cx="64" cy="68" rx="9" ry="12" fill="#fff"/><ellipse cx="96" cy="68" rx="9" ry="12" fill="#fff"/><circle cx="65" cy="70" r="5" fill="#3b85c8"/><circle cx="95" cy="70" r="5" fill="#3b85c8"/><circle cx="65" cy="70" r="2" fill="#25354a"/><circle cx="95" cy="70" r="2" fill="#25354a"/><path d="M69 91 Q80 101 92 90" stroke="#a85643" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M40 117 Q17 114 20 140" stroke="#f6c79e" stroke-width="17" stroke-linecap="round"/><path d="M120 117 Q143 115 140 140" stroke="#f6c79e" stroke-width="17" stroke-linecap="round"/><circle cx="21" cy="145" r="9" fill="#f6c79e"/><circle cx="140" cy="145" r="9" fill="#f6c79e"/></svg><div class="htext"><h1>مغامرات إياد في العلوم 🔬</h1><p>تعال نكتشف العلوم ونحل الأسئلة مع إياد!</p><div class="topics"><span class="topic">حي وغير حي</span><span class="topic">الماء وتغير حالاته</span><span class="topic">الانصهار والتجمد</span><span class="topic">التبخر والتكاثف</span><span class="topic">صغار الحيوانات</span></div></div></section>
<section class="panel" id="start"><h2 style="text-align:center">اختر نوع التحدّي 🎯</h2><p style="text-align:center">كل جولة فيها 10 أسئلة، وعند الإجابة الصحيحة تجمع نجوم!</p><div style="text-align:center"><button class="btn" onclick="startGame('tf')">صح أم خطأ</button><button class="btn secondary" onclick="startGame('mc')">اختر الإجابة الصحيحة</button><button class="btn light" onclick="startGame('mix')">تحدّي مختلط</button></div></section>
<section class="panel hide" id="game"><div class="badges"><span class="badge" id="counter">السؤال 1/10</span><span class="badge" id="score">⭐ 0</span></div><div class="progress" style="margin:15px 0"><div class="bar" id="bar"></div></div><div class="question" id="q"></div><div class="choices" id="choices"></div><div class="feedback hide" id="feedback"></div><div style="text-align:center;margin-top:10px"><button class="btn" id="next" disabled onclick="nextQuestion()">السؤال التالي</button></div></section>
<section class="panel hide" id="result" style="text-align:center"><h2>أحسنت يا بطل! 🎉</h2><div style="font-size:2.5rem" id="stars"></div><h3 id="finalScore"></h3><p id="msg"></p><button class="btn" onclick="backHome()">العب مرة أخرى</button></section><p class="foot">by Eng.Rawan khlef</p></div>
<script>
const questions=[
{t:'tf',q:'النبات كائن حي لأنه ينمو ويحتاج إلى الماء.',a:true,e:'النبات حي؛ ينمو ويحتاج إلى الماء والهواء.'},
{t:'tf',q:'الحجر كائن حي لأنه موجود في الطبيعة.',a:false,e:'الحجر غير حي، فهو لا ينمو ولا يتكاثر.'},
{t:'tf',q:'الحيوان يحتاج إلى الغذاء والماء ليعيش.',a:true,e:'الحيوانات كائنات حية تحتاج إلى الغذاء والماء.'},
{t:'tf',q:'الكرسي كائن حي لأنه مصنوع من الخشب.',a:false,e:'الكرسي شيء غير حي، حتى لو كان مصنوعًا من خشب شجرة.'},
{t:'tf',q:'يمكن أن تنمو البذرة لتصبح نباتًا.',a:true,e:'البذور تنبت وتنمو عندما تتوفر الظروف المناسبة.'},
{t:'tf',q:'الماء السائل يتحول إلى ثلج عند التجمّد.',a:true,e:'التجمّد هو تحول الماء السائل إلى الحالة الصلبة.'},
{t:'tf',q:'انصهار الثلج يعني تحوله من سائل إلى صلب.',a:false,e:'الانصهار هو تحول المادة من صلب إلى سائل، مثل ذوبان الثلج.'},
{t:'tf',q:'عندما تسخن مياه البركة قد يتبخر جزء منها.',a:true,e:'التبخر يحول الماء السائل إلى بخار ماء.'},
{t:'tf',q:'التكاثف هو تحول بخار الماء إلى قطرات ماء.',a:true,e:'عند التبريد يتحول بخار الماء إلى قطرات سائلة.'},
{t:'tf',q:'قطرات الماء على سطح كوب بارد جاءت من داخل الكوب.',a:false,e:'غالبًا تتكون من بخار الماء في الهواء عندما يبرد على سطح الكوب.'},
{t:'tf',q:'صغير القطة يسمى هرًّا أو kitten.',a:true,e:'تسمى القطة الصغيرة هرًّا/قُطَيْطًا.'},
{t:'tf',q:'صغير الدجاج يسمى عجلًا.',a:false,e:'صغير الدجاج هو كتكوت.'},
{t:'tf',q:'صغار الحيوانات تشبه آباءها في كثير من صفاتها.',a:true,e:'غالبًا تشبه الصغار الحيوانات البالغة من النوع نفسه.'},
{t:'tf',q:'كل الحيوانات تلد صغارها ولا تبيض أبدًا.',a:false,e:'بعض الحيوانات تلد، وأخرى تضع البيض.'},
{t:'tf',q:'يحتاج صغير الحيوان إلى الرعاية والحماية.',a:true,e:'تحتاج صغار كثيرة إلى رعاية وحماية حتى تكبر.'},
{t:'mc',q:'أيّ مما يلي كائن حي؟',opts:['الصخرة','الشجرة','الطاولة'],a:1,e:'الشجرة كائن حي؛ تنمو وتحتاج إلى الماء والهواء.'},
{t:'mc',q:'أي شيء لا ينمو ولا يتنفس ولا يتكاثر؟',opts:['القطة','العصفور','الحقيبة'],a:2,e:'الحقيبة شيء غير حي.'},
{t:'mc',q:'ما الذي يحتاجه النبات ليعيش؟',opts:['الماء والضوء','الألعاب','الحلوى'],a:0,e:'النبات يحتاج الماء والضوء والهواء، وغيرها من الظروف المناسبة.'},
{t:'mc',q:'ماذا نسمي تحول الثلج إلى ماء؟',opts:['التجمد','الانصهار','التكاثف'],a:1,e:'الانصهار: تحول المادة من الحالة الصلبة إلى السائلة.'},
{t:'mc',q:'ماذا يحدث للماء عندما يوضع في مكان شديد البرودة؟',opts:['يتجمد','يتبخر فورًا','يتحول إلى تراب'],a:0,e:'عندما يبرد الماء كثيرًا، يتجمد ويصبح صلبًا.'},
{t:'mc',q:'أي مثال يدل على التبخر؟',opts:['تجف الملابس المبللة في الشمس','يتحول الماء إلى ثلج','تتكون قطرات على كوب بارد'],a:0,e:'تساعد حرارة الشمس على تبخر الماء من الملابس.'},
{t:'mc',q:'ما العملية التي تكون قطرات على زجاج بارد؟',opts:['التبخر','التكاثف','الانصهار'],a:1,e:'يتكاثف بخار الماء على السطح البارد ويتحول إلى قطرات.'},
{t:'mc',q:'ما الحالة التي يكون عليها الثلج؟',opts:['صلبة','سائلة','غازية'],a:0,e:'الثلج ماء في الحالة الصلبة.'},
{t:'mc',q:'أي مثال هو ماء في الحالة الغازية؟',opts:['مكعب ثلج','بخار الماء','ماء في كأس'],a:1,e:'بخار الماء هو الماء في الحالة الغازية.'},
{t:'mc',q:'ما صغير الدجاج؟',opts:['جرو','كتكوت','عجل'],a:1,e:'صغير الدجاج يسمى كتكوتًا.'},
{t:'mc',q:'ما صغير الكلب؟',opts:['جرو','حمل','مهر'],a:0,e:'صغير الكلب يسمى جروًا.'},
{t:'mc',q:'ما صغير الحصان؟',opts:['كتكوت','مهر','فرخ'],a:1,e:'صغير الحصان يسمى مهرًا.'},
{t:'mc',q:'أي حيوان يخرج من البيضة؟',opts:['الكتكوت','القطة','البقرة'],a:0,e:'يفقس الكتكوت من البيضة.'},
{t:'mc',q:'لماذا تحمي الحيوانات صغارها؟',opts:['لتساعدها على البقاء والنمو','لتمنعها من الأكل','لأنها لا تحتاج إلى شيء'],a:0,e:'الرعاية والحماية تساعد الصغار على البقاء والنمو.'},
{t:'mc',q:'أي ترتيب صحيح لتغير الماء؟',opts:['ثلج ← ماء عند الانصهار','ماء ← ثلج عند التبخر','بخار ← ثلج عند التكاثف فقط'],a:0,e:'عند الانصهار يتحول الثلج إلى ماء سائل.'},
{t:'mc',q:'أي شيء حي من هذه الخيارات؟',opts:['كرة','سمكة','قلم'],a:1,e:'السمكة كائن حي، تحتاج إلى الغذاء وتكبر.'}
];
let mode='mix',list=[],idx=0,score=0,selected=null,answered=false;
function startGame(m){mode=m;list=questions.filter(x=>m==='mix'||x.t===m);list=list.sort(()=>Math.random()-.5).slice(0,10);idx=0;score=0;document.getElementById('start').classList.add('hide');document.getElementById('result').classList.add('hide');document.getElementById('game').classList.remove('hide');render()}
function render(){selected=null;answered=false;document.getElementById('next').disabled=true;document.getElementById('feedback').className='feedback hide';document.getElementById('counter').textContent=`السؤال ${idx+1}/${list.length}`;document.getElementById('score').textContent=`⭐ ${score}`;document.getElementById('bar').style.width=`${idx/list.length*100}%`;let item=list[idx];document.getElementById('q').textContent=item.q;let c=document.getElementById('choices');c.innerHTML='';let opts=item.t==='tf'?['صح','خطأ']:item.opts;opts.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>choose(i);c.appendChild(b)})}
function choose(i){if(answered)return;answered=true;selected=i;let item=list[idx],correct=item.t==='tf'?(i===(item.a?0:1)):i===item.a;document.querySelectorAll('.choice').forEach((el,n)=>{el.disabled=true;if(n===i)el.classList.add('selected')});if(correct)score++;let f=document.getElementById('feedback');f.textContent=(correct?'إجابة رائعة! ⭐ ':'مو مشكلة، نتعلم مع إياد! 💡')+item.e;f.className='feedback '+(correct?'correct':'wrong');document.getElementById('score').textContent=`⭐ ${score}`;document.getElementById('next').disabled=false;document.getElementById('next').textContent=idx===list.length-1?'عرض النتيجة':'السؤال التالي'}
function nextQuestion(){if(idx<list.length-1){idx++;render()}else finish()}
function finish(){document.getElementById('game').classList.add('hide');document.getElementById('result').classList.remove('hide');document.getElementById('finalScore').textContent=`أجبت بشكل صحيح عن ${score} من ${list.length} أسئلة!`;let n=score>=9?'⭐⭐⭐':score>=6?'⭐⭐':'⭐';document.getElementById('stars').textContent=n;document.getElementById('msg').textContent=score>=9?'يا سلام! إياد فخور بك، أنت عالم صغير مبدع!':score>=6?'ممتاز! جرّب جولة أخرى لتجمع المزيد من النجوم.':'لا تستسلم! راجع الدروس وجرّب مرة ثانية، أنت قادر!';document.getElementById('bar').style.width='100%'}
function backHome(){document.getElementById('result').classList.add('hide');document.getElementById('start').classList.remove('hide')}
</script></body></html>
